services:
  syncmeta:
    image: ghcr.io/febsho/syncmeta:latest
    pull_policy: always
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Everything in .env reaches the container. Without this only the variables
    # named below were passed, so ADMIN_PASSWORD and SITE_ACCESS_PASSWORD could
    # be set in .env and silently do nothing — /admin just stayed disabled.
    # required: false keeps `docker compose up` working with no .env at all.
    env_file:
      - path: .env
        required: false
    environment:
      PROFILE_STORE_FILE: /app/data/profiles.json
      SYNCMETA_MASTER_KEY: ${SYNCMETA_MASTER_KEY:-}
      SYNCMETA_MAX_CONCURRENT_SYNCS: ${SYNCMETA_MAX_CONCURRENT_SYNCS:-1}
      SYNCMETA_LIST_RESOLVE_WORKERS: ${SYNCMETA_LIST_RESOLVE_WORKERS:-2}
      SYNCMETA_LIST_WRITE_WORKERS: ${SYNCMETA_LIST_WRITE_WORKERS:-1}
      SYNCMETA_ACTIVITY_WRITE_WORKERS: ${SYNCMETA_ACTIVITY_WRITE_WORKERS:-1}
      SYNCMETA_SOURCE_SYNC_WORKERS: ${SYNCMETA_SOURCE_SYNC_WORKERS:-2}
      SYNCMETA_SIMKL_FETCH_WORKERS: ${SYNCMETA_SIMKL_FETCH_WORKERS:-2}
      SYNCMETA_ACTIVITY_SOURCE_WORKERS: ${SYNCMETA_ACTIVITY_SOURCE_WORKERS:-2}
      SYNCMETA_PREWARM_WORKERS: ${SYNCMETA_PREWARM_WORKERS:-2}
      SYNCMETA_ANILIST_PREWARM_LIMIT: ${SYNCMETA_ANILIST_PREWARM_LIMIT:-50}
      SYNCMETA_SCHEDULE_JITTER_SECONDS: ${SYNCMETA_SCHEDULE_JITTER_SECONDS:-900}
      # Keep at 1. The scheduler and sync runner live in the process, so a
      # second worker is a second scheduler running the same syncs twice.
      SYNCMETA_GUNICORN_WORKERS: ${SYNCMETA_GUNICORN_WORKERS:-1}
      SYNCMETA_GUNICORN_THREADS: ${SYNCMETA_GUNICORN_THREADS:-6}
      SYNCMETA_GUNICORN_TIMEOUT: ${SYNCMETA_GUNICORN_TIMEOUT:-120}
      SYNCMETA_SCHEDULER_STARTUP_GRACE_SECONDS: ${SYNCMETA_SCHEDULER_STARTUP_GRACE_SECONDS:-20}
      SYNCMETA_MAPPING_WRITE_WORKERS: ${SYNCMETA_MAPPING_WRITE_WORKERS:-1}
    volumes:
      - ./data:/app/data
    cpus: ${SYNCMETA_CPU_LIMIT:-1.0}
    mem_limit: ${SYNCMETA_MEMORY_LIMIT:-1536m}
    mem_reservation: ${SYNCMETA_MEMORY_RESERVATION:-768m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
